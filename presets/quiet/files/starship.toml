# quiet: one-line starship prompt (tweak-my-term preset)
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
command_timeout = 400
scan_timeout = 20
format = "$directory$git_branch$git_status$cmd_duration$python$nodejs$character"
palette = "quiet"

[palettes.quiet]
fg = "#D5D8DE"
muted = "#6B7280"
accent = "#8FB3C9"
green = "#9DBF8F"
red = "#D47E7E"
yellow = "#D9BE85"

[directory]
style = "accent"
truncation_length = 3
truncate_to_repo = true
read_only = " ro"

[git_branch]
format = "[$branch]($style) "
style = "muted"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "yellow"

[cmd_duration]
min_time = 2000
format = "[$duration]($style) "
style = "muted"

[python]
format = "[py $version]($style) "
style = "muted"
detect_extensions = []

[nodejs]
format = "[node $version]($style) "
style = "muted"
detect_extensions = []

[character]
success_symbol = "[›](accent)"
error_symbol = "[›](red)"
