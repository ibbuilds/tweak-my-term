# gruvbox-cozy (tmt)
font-family = "JetBrainsMono Nerd Font"
font-size = 13
adjust-cell-height = 20%
window-padding-x = 16
window-padding-y = 12
window-padding-balance = true
background = #282828
foreground = #ebdbb2
cursor-color = #fe8019
cursor-text = #282828
selection-background = #504945
selection-foreground = #ebdbb2
palette = 0=#282828
palette = 1=#cc241d
palette = 2=#98971a
palette = 3=#d79921
palette = 4=#458588
palette = 5=#b16286
palette = 6=#689d6a
palette = 7=#a89984
palette = 8=#928374
palette = 9=#fb4934
palette = 10=#b8bb26
palette = 11=#fabd2f
palette = 12=#83a598
palette = 13=#d3869b
palette = 14=#8ec07c
palette = 15=#ebdbb2
background-opacity = 0.96
background-blur = 20
cursor-style = block
cursor-style-blink = false
unfocused-split-opacity = 0.85
command = /usr/bin/fish
initial-command = zellij --layout gruvbox-cozy
keybind = ctrl+shift+comma=reload_config
