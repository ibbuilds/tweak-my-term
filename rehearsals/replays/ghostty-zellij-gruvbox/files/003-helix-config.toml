# gruvbox-cozy (tmt)
theme = "gruvbox"

[editor]
line-number = "relative"
cursorline = true
color-modes = true
true-color = true
bufferline = "multiple"
scrolloff = 6
mouse = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.statusline]
left = ["mode", "spinner", "file-name", "file-modification-indicator"]
right = ["diagnostics", "selections", "position", "file-encoding"]

[editor.indent-guides]
render = true
character = "▏"

[editor.lsp]
display-messages = true
