# gruvbox-cozy (tmt)
palette = "gruvbox"
add_newline = true
command_timeout = 500
format = """
[╭─](bright-black)$directory$git_branch$git_status$fill$cmd_duration
[╰─](bright-black)$character"""

[palettes.gruvbox]
accent = "#fe8019"
red = "#fb4934"
green = "#b8bb26"
yellow = "#fabd2f"
blue = "#83a598"
purple = "#d3869b"
cyan = "#8ec07c"
bright-black = "#928374"

[fill]
symbol = " "

[directory]
style = "bold yellow"
truncation_length = 3
truncation_symbol = "…/"
format = "[ $path]($style)[$read_only]($style) "
read_only = " 󰌾"

[git_branch]
symbol = " "
style = "cyan"
format = "[$symbol$branch]($style) "

[git_status]
style = "purple"
format = "[($all_status$ahead_behind)]($style) "

[cmd_duration]
min_time = 2000
style = "bright-black"
format = "[ $duration]($style)"

[character]
success_symbol = "[❯](bold accent)"
error_symbol = "[❯](bold red)"
