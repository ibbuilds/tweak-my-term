set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",alacritty:RGB"
set -g mouse on
set -g base-index 1
set -g escape-time 10
set -g status-position top
set -g status-interval 5
set -g status-style "bg=#0A0A12,fg=#D6E4F0"
set -g status-left-length 30
set -g status-right-length 60
set -g status-left "#[bg=#FF2A9D,fg=#0A0A12,bold]  #S #[bg=#0A0A12,fg=#FF2A9D] "
set -g status-right "#[fg=#00F0FF]#h #[fg=#FCEE0A]%a %d %b #[fg=#FF2A9D,bold]%H:%M "
setw -g window-status-format "#[fg=#5A5F7A] #I:#W "
setw -g window-status-current-format "#[fg=#00F0FF,bold] #I:#W "
set -g pane-border-style "fg=#3A1450"
set -g pane-active-border-style "fg=#FF2A9D"
set -g message-style "bg=#0A0A12,fg=#FCEE0A"
bind r source-file ~/.config/neon-district/tmux.conf \; display "reloaded"
