# rainy-forest-lamplight
[general]
live_config_reload = true

[window]
decorations = "None"
opacity = 0.96
padding = { x = 24, y = 18 }
dynamic_padding = false

[font]
size = 11

[font.normal]
family = "Maple Mono NF"
style = "Regular"

[font.bold]
style = "Bold"

[font.italic]
style = "Italic"

[font.bold_italic]
style = "Bold Italic"

[cursor]
style = { shape = "Beam", blinking = "Never" }

[colors.primary]
background = "#1b2420"
foreground = "#d3cfb8"

[colors.cursor]
text = "#1b2420"
cursor = "#f0b865"

[colors.selection]
text = "#e6e2cc"
background = "#34463c"

[colors.normal]
black = "#34423a"
red = "#d98a7a"
green = "#9ab87a"
yellow = "#e0b56a"
blue = "#7fb0a6"
magenta = "#c49ab0"
cyan = "#86bfa0"
white = "#c9c5ae"

[colors.bright]
black = "#6b7a70"
red = "#e6a190"
green = "#b3cf94"
yellow = "#f0c987"
blue = "#9cc7be"
magenta = "#d6b2c4"
cyan = "#a3d2b8"
white = "#ece8d2"
