# library-2am-green (tweak-my-term)
font_family Terminess Nerd Font Mono
font_size 11.0
adjust_line_height 120%
disable_ligatures always
window_padding_width 10 14
cursor_shape block
cursor_blink_interval 0
tab_bar_style hidden
hide_window_decorations yes
background_opacity 1.0
scrollback_lines 5000
confirm_os_window_close 0
enabled_layouts splits,stack
map ctrl+left neighboring_window left
map ctrl+right neighboring_window right
map ctrl+up neighboring_window up
map ctrl+down neighboring_window down
map ctrl+alt+z toggle_layout stack
window_border_width 1pt
active_border_color #FFB84A
inactive_border_color #14401F
startup_session ~/.config/kitty/library.session
include library-green.conf
