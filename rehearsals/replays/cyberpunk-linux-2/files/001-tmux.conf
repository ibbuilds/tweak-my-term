set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g mouse on
set -g focus-events on
set -sg escape-time 10
set -g status-interval 5
bind r source-file ~/.tmux.conf \; display "reloaded"

set -g status-style "bg=#0A0714,fg=#B9B4D6"
set -g status-left "#[bg=#FF2A9D,fg=#0A0714,bold]  #S #[default] "
set -g status-right "#[fg=#00F0FF]%H:%M #[fg=#6C6592]%a %d %b #[bg=#00F0FF,fg=#0A0714,bold] #h "
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=#FF2A9D,bold] #I:#W "
set -g pane-border-style "fg=#3A1D5C"
set -g pane-active-border-style "fg=#00F0FF"
set -g window-style "bg=#0A0714"
set -g message-style "bg=#FF2A9D,fg=#0A0714"
