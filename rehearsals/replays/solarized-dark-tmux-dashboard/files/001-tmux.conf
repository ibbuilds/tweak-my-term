# Solarized Dark dashboard (tweak-my-term)
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g focus-events on
set -sg escape-time 10
set -g status-interval 5
bind r source-file ~/.tmux.conf \; display "reloaded"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

set -g status-style               "bg=#073642,fg=#839496"
set -g message-style              "bg=#268BD2,fg=#002B36,bold"
set -g message-command-style      "bg=#002B36,fg=#268BD2"
set -g mode-style                 "bg=#073642,fg=#93A1A1"
set -g pane-border-style          "fg=#073642"
set -g pane-active-border-style   "fg=#268BD2"
setw -g window-status-style         "fg=#586E75"
setw -g window-status-current-style "fg=#268BD2,bold"
setw -g window-status-activity-style "fg=#B58900"
set -g display-panes-colour        "#586E75"
set -g display-panes-active-colour "#268BD2"
set -g clock-mode-colour           "#268BD2"
setw -g window-style        "bg=#002B36"
setw -g window-active-style "bg=#002B36"
set -g status-left  "#[fg=#268BD2,bold] #S #[default]"
set -g status-right "#[fg=#586E75]%H:%M "
