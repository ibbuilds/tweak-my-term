# neon-grid: colors, font, window, dashboard autostart (tweak-my-term)
[colors.primary]
background = "#0A0B14"
foreground = "#D5D9F0"

[colors.cursor]
text = "#0A0B14"
cursor = "#FF2E97"

[colors.selection]
background = "#2A2250"
text = "CellForeground"

[colors.normal]
black = "#14152A"
red = "#FF4D6D"
green = "#3DF5A0"
yellow = "#F8E45C"
blue = "#5B7CFF"
magenta = "#FF2E97"
cyan = "#22E4F2"
white = "#B4B9D8"

[colors.bright]
black = "#5A5E85"
red = "#FF7A90"
green = "#7CFFC4"
yellow = "#FFF08A"
blue = "#8AA2FF"
magenta = "#FF6BB8"
cyan = "#7DF3FA"
white = "#F4F6FF"

[font]
size = 11

[font.normal]
family = "JetBrainsMono NFM"
style = "Regular"

[font.bold]
style = "Bold"

[font.italic]
style = "Italic"

[font.bold_italic]
style = "Bold Italic"

[window]
opacity = 0.92
padding = { x = 8, y = 6 }
dynamic_padding = false
decorations = "None"

[terminal.shell]
program = "bash"
args = ["-l", "-c", "bash \"$HOME/.config/neon-grid/dashboard.sh\""]
