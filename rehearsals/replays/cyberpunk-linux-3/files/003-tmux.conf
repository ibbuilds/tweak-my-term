# neon-grid tmux (tweak-my-term)
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g mouse on
set -g focus-events on
set -sg escape-time 10
set -g status-interval 5
set -g status-position bottom
set -g status-left-length 30
set -g status-right-length 60
set -g status-style "bg=#0A0B14,fg=#D5D9F0"
set -g status-left "#[bg=#FF2E97,fg=#0A0B14,bold] #S #[default] "
set -g status-right "#[fg=#22E4F2]#h #[fg=#5A5E85]| #[fg=#D5D9F0]%a %d %b #[fg=#FF2E97,bold]%H:%M "
setw -g window-status-format "#[fg=#5A5E85] #I:#W "
setw -g window-status-current-format "#[fg=#22E4F2,bold] #I:#W "
set -g message-style "bg=#FF2E97,fg=#0A0B14,bold"
set -g mode-style "bg=#2A2250,fg=#F4F6FF"
set -g pane-border-style "fg=#5A5E85"
set -g pane-active-border-style "fg=#FF2E97"
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"
