[general]
live_config_reload = true

[window]
decorations = "None"
opacity = 0.94
padding = { x = 20, y = 16 }
dynamic_padding = false

[font]
size = 11

[font.offset]
x = 0
y = 3

[font.glyph_offset]
x = 0
y = 1

[cursor]
unfocused_hollow = true
thickness = 0.12

[cursor.style]
shape = "Beam"
blinking = "Off"

